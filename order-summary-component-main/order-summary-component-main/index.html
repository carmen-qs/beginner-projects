<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Order summary card</title>
  
</head>

<body>
  <div class="container">
      <img src="/images/illustration-hero.svg" alt="Listen to music" class="imagen">

        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Impedit, aliquam praesentium! A ut quod animi tempora, commodi omnis pariatur expedita.
